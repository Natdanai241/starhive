<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0724">
<title>รังดาว · STARHIVE — Colonies of Kepler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--bg0:#0b0724;--bg1:#171042;--bg2:#241a5e;
--coral:#ff7a59;--peach:#ffc9a3;--mint:#5ef2c2;--lav:#b9a2ff;--cream:#fff4e3;--gold:#ffc94d;
--ink:#fff7ee;--muted:#b3aadf;--line:rgba(185,162,255,.22);--vh:100vh;
--fd:"Fredoka","Mitr",system-ui,sans-serif;--ft:"Mitr","Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif}
html,body{height:100%;width:100%;overflow:hidden;position:fixed;inset:0;background:var(--bg0);color:var(--ink);
font-family:var(--ft);font-weight:400;font-size:15px;line-height:1.3;overscroll-behavior:none;
-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button *{pointer-events:none}
input{font:inherit}
b,strong{font-weight:500}

/* ================= BACKGROUND: retro space ================= */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
background:linear-gradient(180deg,#0b0724 0%,#171042 45%,#2a1d63 78%,#3b2a7a 100%)}
#bg .stars{position:absolute;inset:-10%;background-repeat:repeat}
#bg .s1{background-image:
radial-gradient(1.2px 1.2px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#ffe9d6,transparent),
radial-gradient(1.4px 1.4px at 160px 60px,#fff,transparent),radial-gradient(1px 1px at 200px 180px,#cfc4ff,transparent),
radial-gradient(1.2px 1.2px at 60px 200px,#fff,transparent);background-size:230px 230px;opacity:.75}
#bg .s2{background-image:
radial-gradient(1.8px 1.8px at 50px 80px,#fff,transparent),radial-gradient(1.5px 1.5px at 260px 40px,#ffd9c7,transparent),
radial-gradient(1.6px 1.6px at 180px 260px,#d9ffef,transparent);background-size:340px 340px;animation:tw 5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:.9}}
#bg .neb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.42;will-change:transform}
#bg .n1{width:60vmax;height:40vmax;left:-15vmax;top:8%;background:radial-gradient(circle,#7a3fa0,transparent 70%);animation:nd 60s ease-in-out infinite alternate}
#bg .n2{width:50vmax;height:34vmax;right:-12vmax;top:30%;background:radial-gradient(circle,#ff7a59,transparent 70%);opacity:.22;animation:nd 75s ease-in-out infinite alternate-reverse}
@keyframes nd{from{transform:translate(0,0)}to{transform:translate(6vmax,3vmax)}}
#bg .planet{position:absolute;right:-6vmax;top:-7vmax;width:30vmax;height:30vmax;border-radius:50%;
background:radial-gradient(circle at 32% 30%,#ffd2b0 0%,#ff9a73 28%,#c4508a 62%,#4b2a86 100%);
box-shadow:inset -3vmax -2vmax 5vmax rgba(20,8,60,.65),0 0 0 1px rgba(255,255,255,.05);animation:pf 22s ease-in-out infinite}
#bg .ring{position:absolute;left:-28%;top:38%;width:156%;height:26%;border-radius:50%;
border:.55vmax solid rgba(255,214,186,.45);border-top-color:rgba(255,214,186,.12);transform:rotate(-16deg)}
@keyframes pf{0%,100%{transform:translateY(0)}50%{transform:translateY(1.2vmax)}}
#bg .ground{position:absolute;left:-30vw;right:-30vw;bottom:-30vh;height:52vh;border-radius:50%;
background:radial-gradient(ellipse at 50% 10%,#8c78e0 0%,#5a45b8 30%,#2d2172 70%);
box-shadow:0 -12px 60px rgba(185,162,255,.25)}
#bg .ground:before{content:"";position:absolute;inset:0;border-radius:50%;
background:radial-gradient(circle at 30% 18%,rgba(30,18,80,.55) 0 2.2vmax,transparent 2.3vmax),
radial-gradient(circle at 62% 12%,rgba(30,18,80,.45) 0 1.4vmax,transparent 1.5vmax),
radial-gradient(circle at 78% 22%,rgba(30,18,80,.4) 0 2.8vmax,transparent 2.9vmax),
radial-gradient(circle at 45% 28%,rgba(30,18,80,.35) 0 1vmax,transparent 1.1vmax)}
#bg .shoot{position:absolute;top:14%;left:-20%;width:140px;height:2px;border-radius:2px;
background:linear-gradient(90deg,transparent,#fff4e3);opacity:0;transform:rotate(14deg);animation:sh 13s linear infinite 3s}
@keyframes sh{0%{opacity:0;transform:translate(0,0) rotate(14deg)}2%{opacity:.9}8%{opacity:0;transform:translate(70vw,18vh) rotate(14deg)}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){#bg *{animation:none!important}}

/* ================= ATOMS ================= */
.clay{background:linear-gradient(165deg,#30277a 0%,#221a5c 55%,#1a1349 100%);border:1px solid rgba(185,162,255,.22);
border-radius:20px;box-shadow:inset 0 2px 0 rgba(255,255,255,.12),inset 0 -5px 0 rgba(8,4,30,.35),0 16px 34px rgba(4,2,20,.6)}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 12px;border-radius:14px;
font-family:var(--ft);font-weight:500;font-size:13px;line-height:1.15;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
background:linear-gradient(180deg,#9a84ff,#5d45d8);border:1px solid rgba(255,255,255,.24);
box-shadow:0 4px 0 #3a2896,0 10px 20px rgba(4,2,20,.45),inset 0 1px 0 rgba(255,255,255,.38);
transition:transform .1s ease,filter .15s ease,box-shadow .1s ease}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #3a2896,0 4px 10px rgba(4,2,20,.45),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.co{background:linear-gradient(180deg,#ffa07c,#ff6a4d);box-shadow:0 4px 0 #b4402a,0 10px 22px rgba(255,106,77,.28),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.co:active{box-shadow:0 1px 0 #b4402a}
.btn.mi{background:linear-gradient(180deg,#9cfadd,#34d3a2);color:#0d2e28;box-shadow:0 4px 0 #1b8a68,0 10px 20px rgba(4,2,20,.4),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.mi:active{box-shadow:0 1px 0 #1b8a68}
.btn.go{background:linear-gradient(180deg,#ffe592,#ffb52e);color:#3a2300;box-shadow:0 4px 0 #b57a0c,0 10px 20px rgba(4,2,20,.4),inset 0 1px 0 rgba(255,255,255,.65)}
.btn.go:active{box-shadow:0 1px 0 #b57a0c}
.btn.gh{background:rgba(255,255,255,.07);border:1px solid var(--line);box-shadow:none}
.btn[disabled]{opacity:.35;filter:grayscale(.7);pointer-events:none}
.btn.big{width:100%;padding:13px 16px;font-size:15px;border-radius:16px}
.ic{width:17px;height:17px;flex:none;vertical-align:-3px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.ic.s{width:13px;height:13px;vertical-align:-2px}
.ic.l{width:24px;height:24px}
.mini{font-size:11.5px;color:var(--muted);font-weight:300}
.tag{font-size:10.5px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.09);border:1px solid var(--line);white-space:nowrap}
.tag.ok{background:rgba(94,242,194,.18);border-color:var(--mint);color:#c9ffef}
.tag.no{background:rgba(255,122,89,.16);border-color:var(--coral);color:#ffd6c9}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.avc{display:inline-block;line-height:0;flex:none}

/* ================= GAME SHELL ================= */
#app{position:fixed;left:0;top:0;width:100%;height:var(--vh);z-index:2;display:none;flex-direction:column;gap:6px;padding:6px;overflow:hidden;
padding-top:max(6px,env(safe-area-inset-top));padding-bottom:max(6px,env(safe-area-inset-bottom));
padding-left:max(6px,env(safe-area-inset-left));padding-right:max(6px,env(safe-area-inset-right))}
#app.on{display:flex}
#top{flex:0 0 auto;height:48px;display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:18px;overflow:hidden}
.ib{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:12px;font-size:15px;
background:linear-gradient(180deg,#3b3192,#271e68);border:1px solid rgba(255,255,255,.14);
box-shadow:0 3px 0 #160f45,inset 0 1px 0 rgba(255,255,255,.2)}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 #160f45}
.ib.off{opacity:.38}
#logo{flex:none;display:flex;align-items:center;gap:6px}
#logo .lt{line-height:1}
#logo .lt b{display:block;font-size:13px;color:var(--cream)}
#logo .lt i{display:block;font-style:normal;font-family:var(--fd);font-weight:700;font-size:9px;letter-spacing:2.2px;color:var(--coral)}
#tp{flex:none;display:flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;max-width:42%;overflow:hidden;
background:linear-gradient(180deg,rgba(0,0,0,.32),rgba(0,0,0,.14));border:1px solid var(--line)}
#tp .tt{min-width:0;line-height:1.05}
#tp b{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#tp i{display:block;font-style:normal;font-size:9.5px;color:var(--mint)}
#st{flex:1 1 0;min-width:0;font-size:11.5px;font-weight:300;color:#e3dcff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dm{flex:none;display:flex;gap:3px}
.dmi{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-family:var(--fd);font-weight:700;font-size:13px;color:#1a1447;
background:linear-gradient(160deg,#fffaf1,#f2dcc0);box-shadow:0 3px 0 #c9a77e,0 5px 8px rgba(0,0,0,.4)}
#mid{flex:1 1 auto;min-height:0;min-width:0;display:flex;flex-direction:column;gap:6px;overflow:hidden}
#pls{flex:0 0 auto;display:flex;gap:6px;min-width:0;overflow:hidden}
.pc{position:relative;flex:1 1 0;min-width:0;display:flex;align-items:center;gap:6px;padding:5px 7px 5px 5px;border-radius:16px;overflow:hidden;
background:linear-gradient(165deg,#30277a,#1d1650);border:1px solid rgba(185,162,255,.2);
box-shadow:inset 0 1px 0 rgba(255,255,255,.1),inset 0 -3px 0 rgba(0,0,0,.25),0 6px 14px rgba(4,2,20,.45);transition:box-shadow .25s,transform .25s}
.pc:before{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--k);opacity:.9}
.pc.act{border-color:rgba(255,122,89,.8);box-shadow:0 0 0 2px rgba(255,122,89,.45),0 10px 22px rgba(255,122,89,.22),inset 0 1px 0 rgba(255,255,255,.12)}
.pc.act:after{content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--coral);
box-shadow:0 0 0 3px rgba(255,122,89,.25);animation:bl 1.2s ease-in-out infinite}
@keyframes bl{0%,100%{opacity:.35}50%{opacity:1}}
.pc .pi{flex:1 1 auto;min-width:0}
.pc .pn{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:500;min-width:0}
.pc .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .vp{flex:none;font-family:var(--fd);font-weight:700;font-size:11.5px;color:#3a2300;padding:0 6px;border-radius:999px;
background:linear-gradient(180deg,#ffe592,#ffb52e);box-shadow:0 2px 0 #b57a0c}
.pc .pr{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden}
.pc .pr span{display:inline-flex;align-items:center;gap:2px}
.pc .lg{display:none!important}
.pc .bd{font-size:9px;padding:0 5px;border-radius:999px;color:#3a2300;background:var(--gold)}
.pc .of{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;background:rgba(11,7,36,.7)}
#bw{flex:1 1 auto;min-height:0;min-width:0;position:relative;overflow:hidden;border-radius:24px;
background:radial-gradient(120% 90% at 50% 42%,#2c2275 0%,#170f47 58%,#0c0828 100%);border:1px solid rgba(185,162,255,.24);
box-shadow:inset 0 0 0 5px rgba(255,255,255,.025),inset 0 6px 40px rgba(0,0,0,.6),0 14px 30px rgba(4,2,20,.5)}
#bd{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#fx{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:hidden}
#dock{flex:0 0 auto;display:flex;flex-direction:column;gap:6px;padding:7px;border-radius:20px;overflow:hidden}
#me{display:none}
#hand{display:flex;gap:5px;min-width:0}
.rc{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px 2px 4px;border-radius:13px;
background:linear-gradient(180deg,#3b3192,#241b62);border:1px solid rgba(255,255,255,.1);border-top:3px solid var(--rc);
box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 4px 10px rgba(4,2,20,.4);transition:transform .25s,box-shadow .25s}
.rc b{font-family:var(--fd);font-weight:700;font-size:14px;line-height:1}
.rc.z{opacity:.5}
.rc.up{transform:translateY(-4px) scale(1.08);box-shadow:0 0 0 2px var(--rc),0 10px 18px rgba(4,2,20,.5)}
#acts{display:flex;gap:5px;min-width:0}
#acts>*{flex:1 1 0;min-width:0}
@media(max-width:380px){.pc .avc svg{width:22px;height:22px}.btn{font-size:12px;padding:8px 7px}#logo .lt{display:none}}
@media(min-aspect-ratio:1/1){
#mid{flex-direction:row}
#pls{flex:0 0 200px;flex-direction:column}
.pc{flex:0 0 auto;padding:8px 9px 9px 8px;gap:9px}
.pc .pn{font-size:12.5px}
.pc .vp{font-size:13px}
.pc .pr{font-size:10.5px;flex-wrap:wrap;white-space:normal}
.pc .lg{display:inline-flex!important}
#dock{flex-direction:row;align-items:center;gap:10px}
#me{display:flex;align-items:center;gap:8px;flex:none;padding-right:10px;border-right:1px solid var(--line)}
#me b{display:block;font-size:12.5px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#me i{display:block;font-style:normal;font-family:var(--fd);font-weight:700;color:var(--gold);font-size:15px}
#hand{flex:0 0 auto;width:330px}
#acts{flex:1 1 auto}
.btn{font-size:13.5px}
}
@media(min-width:1100px){#pls{flex-basis:230px}#hand{width:380px}}

/* ================= SCREENS ================= */
.scr{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:14px;overflow:auto;-webkit-overflow-scrolling:touch}
.scr.on{display:flex}
.card{width:min(600px,100%);padding:20px;border-radius:28px;max-height:calc(var(--vh) - 28px);overflow:auto;animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
.card h2{font-size:19px;font-weight:500}
.card p.sub{color:var(--muted);font-size:12.5px;font-weight:300;margin:3px 0 12px}
.hero{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.mascot{flex:none;animation:bob 4.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
.ttl .th{font-size:34px;font-weight:600;line-height:1;color:var(--cream);text-shadow:0 4px 0 #3a2896,0 10px 20px rgba(0,0,0,.4)}
.ttl .en{font-family:var(--fd);font-weight:700;font-size:26px;letter-spacing:3px;line-height:1.1;margin-top:4px;
background:linear-gradient(90deg,#ffc9a3,#ff7a59 60%,#ff5e8a);-webkit-background-clip:text;background-clip:text;color:transparent}
.ttl .sb{font-size:12px;color:var(--muted);font-weight:300;margin-top:3px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border-radius:20px;text-align:left;
background:linear-gradient(165deg,#3a3092,#231a62);border:1px solid rgba(255,255,255,.14);
box-shadow:0 5px 0 #150e44,0 14px 26px rgba(4,2,20,.45),inset 0 1px 0 rgba(255,255,255,.2);transition:transform .12s}
.mode:active{transform:translateY(3px);box-shadow:0 2px 0 #150e44}
.mode .mi2{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:22px;
box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),0 4px 10px rgba(0,0,0,.3)}
.mode b{font-size:14.5px}
.mode span{font-size:11px;color:var(--muted);font-weight:300;line-height:1.35}
.mode.hot{background:linear-gradient(165deg,#ff9b76,#e8513a);box-shadow:0 5px 0 #9c3420,0 14px 26px rgba(255,106,77,.3),inset 0 1px 0 rgba(255,255,255,.4)}
.mode.hot span{color:#ffe6dc}
.fl{display:flex;flex-direction:column;gap:5px;margin:9px 0}
.fl label{font-size:12px;color:var(--muted)}
.inp{width:100%;padding:11px 13px;border-radius:14px;color:var(--ink);background:rgba(8,4,30,.45);border:1px solid var(--line);
box-shadow:inset 0 3px 8px rgba(0,0,0,.4)}
.inp:focus{outline:2px solid var(--mint)}
.seg{display:flex;gap:5px;padding:4px;border-radius:15px;background:rgba(8,4,30,.4);border:1px solid var(--line)}
.seg button{flex:1 1 0;min-width:0;padding:8px 4px;border-radius:11px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.seg button.on{color:#0d2e28;font-weight:500;background:linear-gradient(180deg,#9cfadd,#34d3a2);box-shadow:0 3px 0 #1b8a68}
.crew{display:flex;gap:8px;margin:12px 0 4px}
.crew .cm{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border-radius:16px;
background:rgba(8,4,30,.35);border:1px solid var(--line);font-size:11px;text-align:center}
.crew .cm span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl{display:grid;gap:7px;margin:12px 0}
.prow{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:16px;background:rgba(8,4,30,.38);border:1px solid var(--line)}
.prow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code{display:flex;justify-content:center;gap:7px;margin:12px 0}
.code span{width:46px;height:56px;display:grid;place-items:center;border-radius:14px;font-family:var(--fd);font-weight:700;font-size:28px;color:#1a1447;
background:linear-gradient(180deg,#fffaf1,#f2dcc0);box-shadow:0 5px 0 #c9a77e,0 12px 20px rgba(0,0,0,.35)}
.spn{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--coral);animation:spn .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spn{to{transform:rotate(360deg)}}
.eb{padding:10px 12px;border-radius:14px;font-size:12.5px;margin:9px 0;background:rgba(255,122,89,.14);border:1px solid rgba(255,122,89,.5)}
.ok{padding:10px 12px;border-radius:14px;font-size:12.5px;margin:9px 0;background:rgba(94,242,194,.12);border:1px solid rgba(94,242,194,.45)}
.lr{display:flex;gap:6px}.lr input{flex:1;font-size:11.5px}

/* ================= MODAL / SHEET ================= */
#md{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(6,3,22,.66);
backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
#md.on{display:flex}
#mc{position:relative;width:100%;max-width:560px;max-height:calc(var(--vh) - 30px);overflow:auto;border-radius:26px 26px 0 0;
padding:22px 16px calc(16px + env(safe-area-inset-bottom));animation:up .26s ease-out}
#mc:before{content:"";position:absolute;top:8px;left:50%;width:42px;height:5px;margin-left:-21px;border-radius:5px;background:rgba(255,255,255,.22)}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
@media(min-aspect-ratio:1/1){#md{align-items:center;padding:12px}#mc{border-radius:26px;padding:18px}#mc:before{display:none}}
.mh{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:10px}
.mh h3{font-size:16.5px;font-weight:500}
.rr{display:flex;align-items:center;justify-content:space-between;gap:9px;padding:7px 10px;border-radius:14px;margin-bottom:6px;
background:rgba(8,4,30,.38);border:1px solid var(--line)}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:32px;height:32px;border-radius:10px;font-family:var(--fd);font-weight:700;font-size:17px;line-height:1;
background:linear-gradient(180deg,#4a3fa8,#2c2378);box-shadow:0 3px 0 #160f45}
.stp button:active{transform:translateY(2px);box-shadow:none}
.stp span{min-width:22px;text-align:center;font-family:var(--fd);font-weight:700;font-size:15px}
.bld{display:grid;gap:8px}

  co.sort(function(x,y){ return (x[1]-y[1])||(x[0]-y[0]); });
  for(i=0;i<co.length;i++){

    for(j=0;j<6;j++){ var e=ge(cs[j],cs[(j+1)%6]); h.eg.push(e.id); if(e.hx.indexOf(h.id)<0) e.hx.push(h.id); }

var AI={
  score:function(G,v){ var s=0,kinds={},hx=GEO.verts[v].hx,i,r,p;
    for(i=0;i<hx.length;i++){ r=TYPES[G.ht[hx[i]]]; if(!r) continue; p=PIP(G.hn[hx[i]]); s+=p*((r==='ore'||r==='wheat')?1.15:1); kinds[r]=(kinds[r]||0)+p; }
    s+=Object.keys(kinds).length*1.7;
    for(i=0;i<G.ports.length;i++){ var Ed=GEO.edges[G.ports[i].e]; if(Ed.a===v||Ed.b===v) s+=G.ports[i].t==='any'?1.4:(kinds[G.ports[i].t]?2.6:0.7); }
    return s; },
  pickS:function(G,p,l){ var b=l[0],bv=-1e9,jit=(G.pl[p].lv==='easy'?7:0.6),i,s;
    for(i=0;i<l.length;i++){ s=this.score(G,l[i])+Math.random()*jit; if(s>bv){ bv=s; b=l[i]; } } return b; },
  pickR:function(G,p,l){ var b=l[0],bv=-1e9,i,k,j,Ed,s,tmp,ln,ends,adj,vv;
    for(i=0;i<l.length;i++){ Ed=GEO.edges[l[i]]; s=Math.random()*0.9; ends=[Ed.a,Ed.b];
      for(k=0;k<2;k++){ vv=ends[k]; if(!G.vb[vv]&&spaced(G,vv)) s+=this.score(G,vv)*0.85;
        adj=GEO.verts[vv].adj; for(j=0;j<adj.length;j++) if(!G.vb[adj[j]]&&spaced(G,adj[j])) s+=this.score(G,adj[j])*0.3; }
      tmp=G.er[l[i]]; G.er[l[i]]=p; ln=longest(G,p); G.er[l[i]]=tmp;
      s+=ln*1.2; if(ln>=5&&G.lr.o!==p) s+=7; if(s>bv){ bv=s; b=l[i]; } }
    return b; },
  discard:function(P,n){ var d=zeroRes(),pool=[],w={ore:3,wheat:3,brick:2,wood:2,sheep:1},i,k;
    for(i=0;i<5;i++) for(k=0;k<P.res[RES[i]];k++) pool.push(RES[i]);
    pool.sort(function(a,b){ return w[a]-w[b]; }); for(i=0;i<n&&i<pool.length;i++) d[pool[i]]++; return d; },
  robber:function(G,p){ var best=(G.rob===0?1:0),bv=-1e9,h,s,own,i,b;
    for(h=0;h<19;h++){ if(h===G.rob) continue; s=Math.random()*(G.pl[p].lv==='easy'?9:1); own=false;
      for(i=0;i<6;i++){ b=G.vb[GEO.hexes[h].cn[i]]; if(!b) continue; if(b.o===p){ own=true; continue; }
        s+=PIP(G.hn[h])*(b.c?2:1)*(1+pubVP(G,b.o)*0.13)+total(G.pl[b.o].res)*0.3; }
      if(own) s-=40; if(s>bv){ bv=s; best=h; } }
    return best; },
  target:function(G,p){ var t=G.stl.tg.slice(); if(G.pl[p].lv==='easy') return t[rnd(t.length)];
    t.sort(function(a,b){ return (total(G.pl[b].res)+pubVP(G,b)*2)-(total(G.pl[a].res)+pubVP(G,a)*2); }); return t[0]; },
  need:function(G,p){ var P=G.pl[p],n=zeroRes(),goal,r;
    goal=(listC(G,p).length&&P.res.ore+P.res.wheat>=2)?COST.city:COST.settlement;
    for(r in goal) n[r]=Math.max(0,goal[r]-P.res[r]); return n; },
  judge:function(G,p){ var T=G.tr,P=G.pl[p],i; if(!T||!afford(P.res,T.w)) return false;
    var lv=P.lv||'normal'; if(lv==='easy') return Math.random()<0.45;
    var nd=this.need(G,p),val=0;
    for(i=0;i<5;i++){ var r=RES[i]; val+=T.g[r]*(1+(nd[r]>0?1.7:0)); val-=T.w[r]*(1+(P.res[r]<=1?1.2:0)); }
    if(pubVP(G,T.from)>=G.goal-3) val-=1.6;
    return lv==='hard'?val>0.4:val>-0.2; },
  move:function(G,seat){
    var P=G.pl[seat],lv=P.lv||'normal',l,r,i,q;
    if(G.phase==='setup'){ if(G.su.order[G.su.idx]!==seat) return {t:'__w'};
      if(G.su.stage==='s'){ l=listS(G,seat); return l.length?{t:'settle',v:this.pickS(G,seat,l)}:{t:'__w'}; }
      r=listR(G,seat); return r.length?{t:'road',e:this.pickR(G,seat,r)}:{t:'__w'}; }
    if(G.dsc&&G.dsc[seat]) return {t:'discard',res:this.discard(P,G.dsc[seat])};
    if(G.needRob===seat) return {t:'rob',h:this.robber(G,seat)};
    if(G.stl&&G.stl.p===seat) return {t:'steal',tg:this.target(G,seat)};
    if(G.tr&&G.tr.rsp[seat]==='wait') return {t:'resp',yes:this.judge(G,seat)};
    if(G.turn!==seat) return {t:'__w'};
    if(G.ts.free>0){ r=listR(G,seat); return r.length?{t:'road',e:this.pickR(G,seat,r)}:{t:'__w'}; }
    function has(tp){ var f=null,k; for(k=0;k<P.dv.length;k++) if(!f&&P.dv[k].t===tp&&!P.dv[k].used&&P.dv[k].turn<G.tc) f=P.dv[k]; return f; }
    function robHere(){ var k,b; for(k=0;k<6;k++){ b=G.vb[GEO.hexes[G.rob].cn[k]]; if(b&&b.o===seat) return true; } return false; }
    if(!G.ts.rolled){
      if(lv!=='easy'&&!G.ts.dev&&has('knight')&&(robHere()||(lv==='hard'&&P.kn>=2&&G.la.o!==seat&&Math.random()<0.5))) return {t:'play',c:'knight'};
      return {t:'roll'}; }

    if(!G.ts.dev&&lv!=='easy'){
      if(has('mono')){ var bn=0,br=null;
        for(i=0;i<5;i++){ var n2=0; for(q=0;q<G.pl.length;q++) if(q!==seat) n2+=G.pl[q].res[RES[i]]; if(n2>bn){ bn=n2; br=RES[i]; } }
        if(br&&bn>=(lv==='hard'?4:3)) return {t:'play',c:'mono',r:br}; }
      if(has('plenty')){ var nd=this.need(G,seat),wn=[];
        for(i=0;i<5;i++) for(q=0;q<nd[RES[i]]&&wn.length<2;q++) wn.push(RES[i]);
        while(wn.length<2) wn.push('ore');
        var okb=true; for(i=0;i<2;i++) if(G.bank[wn[i]]<=0) okb=false;
        if(okb) return {t:'play',c:'plenty',pk:wn}; }
      if(has('road')&&pcs(G,seat).r<=12&&listR(G,seat).length&&lv==='hard'&&(G.lr.o===seat||P.lrl>=3)) return {t:'play',c:'road'};
      if(has('knight')&&robHere()) return {t:'play',c:'knight'};
    }
    var ct=listC(G,seat),pq=pcs(G,seat),self=this;
    if(ct.length&&afford(P.res,COST.city)&&pq.c<4){ ct.sort(function(a,b){ return self.score(G,b)-self.score(G,a); }); return {t:'city',v:ct[0]}; }
    var sp=listS(G,seat);
    if(sp.length&&afford(P.res,COST.settlement)&&pq.s<5) return {t:'settle',v:this.pickS(G,seat,sp)};
    if(afford(P.res,COST.dev)&&G.deck.length&&(lv==='hard'?Math.random()<0.85:Math.random()<0.5)) return {t:'buy'};
    var rd=listR(G,seat);
    if(rd.length&&afford(P.res,COST.road)&&pq.r<15){
      var worth=lv==='easy'?Math.random()<0.6:(sp.length<2||P.lrl>=3||total(P.res)>=7||Math.random()<0.5);
      if(worth) return {t:'road',e:this.pickR(G,seat,rd)}; }
    if(lv!=='easy'){
      var goals=[['city',COST.city],['settlement',COST.settlement],['dev',COST.dev]];
      for(i=0;i<goals.length;i++){
        var gn=goals[i][0],c=goals[i][1],miss=[],k2;
        if(gn==='city'&&(!ct.length||pq.c>=4)) continue;
        if(gn==='settlement'&&(!sp.length||pq.s>=5)) continue;
        for(k2=0;k2<5;k2++) if((c[RES[k2]]||0)-P.res[RES[k2]]>0) miss.push(RES[k2]);
        if(miss.length!==1) continue;
        var nr=miss[0],ov=null;
        for(k2=0;k2<5;k2++){ var rx=RES[k2]; if(rx===nr) continue; if(P.res[rx]-(c[rx]||0)>=rate(G,seat,rx)&&G.bank[nr]>0){ ov=rx; break; } }
        if(ov) return {t:'bank',g:ov,w:nr};
      }
    }
    return {t:'end'};
  }
};

function reconnect(){
  if(reconning||NET.mode!=='client') return;
  reconning=true;
  (function step(){
    if(NET.mode!=='client'||rtry>=6){
      reconning=false;
      if(NET.mode==='client'){ toast('เชื่อมต่อใหม่ไม่สำเร็จ','e');
        modal('<div class="mh"><h3>📡 สัญญาณขาดหาย</h3></div><p class="mini">ไม่สามารถกลับเข้าสถานีได้</p>'+
          '<div class="row" style="margin-top:12px"><button class="btn co" data-a="rcretry" style="flex:1">ลองใหม่</button>'+
          '<button class="btn gh" data-a="quit" style="flex:1">กลับฐานหลัก</button></div>'); }
      return;
    }
    rtry++; toast('กำลังเชื่อมต่อใหม่ ('+rtry+'/6)…');
    Promise.resolve().then(function(){
      if(NET.peer&&NET.peer.disconnected&&!NET.peer.destroyed){ try{ NET.peer.reconnect(); }catch(e){} return sleep(900); }
      if(!NET.peer||NET.peer.destroyed) return mkPeer(null).then(function(p){ NET.peer=p; });
    }).then(function(){ return waitOpen(NET.peer.connect(roomId(NET.code),{reliable:true}),15000); })
    .then(function(c){ bindClient(c); c.send({t:'join',cid:CID,name:myName}); toast('เชื่อมต่อสำเร็จ'); reconning=false; })
    .catch(function(){ setTimeout(step,1200*rtry); });
  })();
}

  if(UIM==='suS'||UIM==='suR') UIM=null;
  if(s.phase==='play'&&s.needRob===you&&UIM!=='robber'){ UIM='robber'; Q('#gh').innerHTML=svgHits(s); }

  else if(s.tr&&s.tr.from===you&&allAnswered(s.tr)) mTradeRes(s);

function pumpFx(list){
  if(!list) return; var i,j,dup;
  for(i=0;i<list.length;i++){ if(list[i].id<=seenFx) continue; dup=false; for(j=0;j<fxQ.length;j++) if(fxQ[j].id===list[i].id) dup=true; if(!dup) fxQ.push(list[i]); }
  drainFx();
}
function drainFx(){
  if(fxBusy) return; fxBusy=true;
  (function nxt(){
    if(!fxQ.length){ fxBusy=false; if(V&&V.phase==='over'&&Q('#md').className!=='on') mSummary(V); return; }
    var f=fxQ.shift(); if(f.id<=seenFx) return nxt(); seenFx=f.id;
    Promise.resolve().then(function(){ return playFx(f); }).catch(function(e){ console.error('fx',e); }).then(nxt);
  })();
}

    o.p.on('connection',hookConn);
    o.p.on('disconnected',function(){ toast('สัญญาณ Host หลุด — กำลังเชื่อมต่อใหม่','e'); try{ o.p.reconnect(); }catch(e){} });
    o.p.on('error',function(e){ if(e&&e.type==='peer-unavailable') return; console.warn('peer',e); });
    myName=name; LB={code:o.code,host:true,pl:[{cid:CID,name:name,bot:false,on:true}]};
    showScr('scrLobby'); drawLobby();
  }).catch(function(e){ console.error(e); drawCreate('err',(e&&e.message)||'ไม่ทราบสาเหตุ'); });
};
H.jnroom=function(){
  var ce=Q('#jc'),ne=Q('#jn');
  var code=((ce&&ce.value)||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  var nm=((ne&&ne.value)||'ผู้บุกเบิก').slice(0,14); CFG.name=nm;
  if(code.length!==5){ toast('รหัสสถานีต้องมี 5 ตัวอักษร','e'); S_.err(); return; }
  showScr('scrSetup'); drawJoin('load',code);
  NET.mode='client'; NET.code=code; myName=nm; seenFx=0;
  loadPeer().then(function(){ if(NET.peer){ try{ NET.peer.destroy(); }catch(e){} } return mkPeer(null); })
  .then(function(p){ NET.peer=p; p.on('error',function(e){ console.warn('peer',e); }); p.on('disconnected',function(){ try{ p.reconnect(); }catch(e){} });
    return waitOpen(p.connect(roomId(code),{reliable:true}),16000); })
  .then(function(conn){ bindClient(conn); conn.send({t:'join',cid:CID,name:nm}); LB={code:code,pl:[],host:false}; showScr('scrLobby'); drawLobby(); })
  .catch(function(e){ console.error(e); NET.mode='local';
    var m=(e&&e.type==='peer-unavailable')?('ไม่พบสถานีรหัส '+code+' (Host อาจปิดไปแล้ว)'):((e&&e.message)||'เชื่อมต่อไม่สำเร็จ');
    drawJoin('err',{m:m,code:code}); });
};
H.jretry=function(v){ drawJoin('form',{code:v}); };
H.copy=function(){
  var code=LB?LB.code:NET.code,link=location.origin+location.pathname+'?room='+code;
  function done(){ toast('📋 คัดลอกลิงก์แล้ว'); }
  function fallback(){ var i=Q('#lnk'); if(i){ i.select(); try{ document.execCommand('copy'); done(); }catch(e){ toast(link); } } else toast(link); }
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done).catch(fallback); else fallback();
};
H.addbot=function(){
  if(!LB) return; if(LB.pl.length>=4){ toast('ห้องเต็มแล้ว','e'); return; }
  var idx=LB.pl.length;
  LB.pl.push({cid:'bot'+idx+'_'+Date.now(),name:CREW[idx]+' 🤖',bot:true,lv:CFG.lv,on:true});
  pushLobby(); drawLobby();
};
H.kick=function(v){
  if(!LB) return; var i=+v,p=LB.pl[i]; if(!p) return; var c=NET.conns[p.cid];
  if(!p.bot&&c){ try{ c.send({t:'err',fatal:true,m:'คุณถูกนำออกจากสถานี'}); }catch(e){} try{ c.close(); }catch(e){} delete NET.conns[p.cid]; }
  LB.pl.splice(i,1); pushLobby(); drawLobby();
};
H.gostart=function(){
  if(!LB||LB.pl.length<3){ toast('ต้องมีอย่างน้อย 3 คน','e'); return; }
  var list=[],i; for(i=0;i<LB.pl.length;i++) list.push({name:LB.pl[i].name,bot:LB.pl[i].bot,lv:LB.pl[i].lv,cid:LB.pl[i].cid,on:LB.pl[i].on});
  startGame(list,LB.code);
};
H.quit=function(){ closeM(); backMenu(); };
H.cm=closeM;
H.pvok=function(){ if(V) privAck=V.you; Q('#pv').className=''; render(); };
H.again=function(){ closeM(); restart(); };
H.rcretry=function(){ closeM(); rtry=0; reconnect(); };
H.menu=function(){
  modal('<div class="mh"><h3>☰ ห้องควบคุม</h3><button class="btn gh" data-a="cm" style="flex:none">ปิด</button></div><div style="display:grid;gap:9px">'+
    '<button class="btn" data-a="mr">📘 คู่มือภารกิจ</button><button class="btn" data-a="ml">🧾 บันทึกการบิน</button>'+
    (authoritative()?'<button class="btn" data-a="again">🔄 เริ่มภารกิจใหม่</button>':'')+
    ((NET.mode!=='local'&&NET.code)?'<button class="btn mi" data-a="copy">🔗 คัดลอกลิงก์สถานี ('+NET.code+')</button>':'')+
    '<button class="btn co" data-a="quit">🚪 ออกจากภารกิจ</button></div>');
};
H.mr=function(){ mRules(); };
H.ml=function(){
  var l=(V&&V.log)?V.log.slice().reverse().map(function(x){ return '• '+esc(x); }).join('<br>'):'ไม่มีบันทึก';
  modal('<div class="mh"><h3>🧾 บันทึกการบิน</h3><button class="btn gh" data-a="cm" style="flex:none">ปิด</button></div><div style="font-size:12.5px;line-height:1.8;font-weight:300">'+l+'</div>');
};
H.ga=function(v){
  if(!V) return;
  switch(v){
  case 'roll': UIM=null; act({t:'roll'}); break;
  case 'end': UIM=null; act({t:'end'}); break;
  case 'build': mBuild(V); break;
  case 'buy': closeM(); act({t:'buy'}); break;
  case 'road': case 'settle': case 'city':
    closeM(); UIM=(UIM===v)?null:v; render();
    toast(UIM?(v==='road'?'แตะตำแหน่งท่อที่เรืองสีมิ้นต์':v==='city'?'แตะฝักที่พักที่จะอัปเกรด':'แตะจุดสีมิ้นต์เพื่อตั้งฐาน'):'ยกเลิกแล้ว');
    break;
  case 'rob': UIM='robber'; render(); toast('แตะช่องที่จะส่งแรคคูนไป'); break;
  case 'dev': mDev(V); break;
  case 'trade': mTrade(); break;
  case 'dsc': mDiscard(V); break;
  case 'stl': mSteal(V); break;
  case 'trr': mTradeAsk(V); break;
  case 'sum': mSummary(V); break;
  }
};
H.pdev=function(v){
  if(v==='plenty'){ TMP.pk=[]; mPlenty(); return; }
  if(v==='mono'){ mMono(); return; }
  closeM(); act({t:'play',c:v});
  if(v==='road'){ UIM='road'; render(); toast('วางท่อฟรี 2 เส้น'); }
  if(v==='knight'){ UIM='robber'; render(); toast('แตะช่องที่จะส่งแรคคูนไป'); }
};
H.plp=function(v){ if(!TMP.pk) TMP.pk=[]; if(TMP.pk.length<2){ TMP.pk.push(v); mPlenty(); } };
H.plc=function(){ TMP.pk=[]; mPlenty(); };
H.plgo=function(){ var pk=TMP.pk.slice(); closeM(); act({t:'play',c:'plenty',pk:pk}); };
H.mno=function(v){ closeM(); act({t:'play',c:'mono',r:v}); };
H.dp=function(v){ if(TMP.sel[v]<TMP.have[v]&&total(TMP.sel)<TMP.need){ TMP.sel[v]++; reDiscard(); } };
H.dm=function(v){ if(TMP.sel[v]>0){ TMP.sel[v]--; reDiscard(); } };
H.dgo=function(){ var s=TMP.sel; closeM(); act({t:'discard',res:s}); };
H.stg=function(v){ closeM(); act({t:'steal',tg:+v}); };
H.ttab=function(v){ TMP.tab=v; reTrade(); };
H.gp=function(v){ var have=V.pl[V.you].res||zeroRes(); if(TMP.g[v]<have[v]){ TMP.g[v]++; reTrade(); } };
H.gm=function(v){ if(TMP.g[v]>0){ TMP.g[v]--; reTrade(); } };
H.wp=function(v){ if(TMP.w[v]<9){ TMP.w[v]++; reTrade(); } };
H.wm=function(v){ if(TMP.w[v]>0){ TMP.w[v]--; reTrade(); } };
H.tof=function(){ var g=TMP.g,w=TMP.w; closeM(); act({t:'offer',g:g,w:w}); };
H.bg=function(v){ TMP.bg=v; reTrade(); };
H.bw=function(v){ TMP.bw=v; reTrade(); };
H.bgo=function(){ var g=TMP.bg,w=TMP.bw; closeM(); act({t:'bank',g:g,w:w}); };
H.ty=function(){ closeM(); act({t:'resp',yes:true}); };
H.tn=function(){ closeM(); act({t:'resp',yes:false}); };
H.tcf=function(v){ closeM(); act({t:'confirm',tw:+v}); };
H.tcx=function(){ closeM(); act({t:'cancel'}); };
H.__board=function(code){
  var p=code.split(':'),n=+p[1]; S_.click();
  if(p[0]==='v'){ if(UIM==='city') act({t:'city',v:n}); else act({t:'settle',v:n}); if(UIM!=='suS') UIM=null; render(); }
  else if(p[0]==='e'){ act({t:'road',e:n}); if(UIM!=='suR') UIM=null; render(); }
  else if(p[0]==='h'){ act({t:'rob',h:n}); UIM=null; render(); }
};

/* ---------- BOOT ---------- */
try{
  syncSnd();
  window.addEventListener('resize',function(){ if(V&&Q('#app').className==='on') paint(V); });
  window.addEventListener('orientationchange',function(){ setTimeout(function(){ if(V&&Q('#app').className==='on') paint(V); },300); });
  document.addEventListener('visibilitychange',function(){ if(document.hidden) S_.pause(); else S_.resume(); });
  var room=''; try{ room=(new URLSearchParams(location.search).get('room')||'').toUpperCase(); }catch(e){}
  if(/^[A-Z0-9]{5}$/.test(room)){ showScr('scrSetup'); drawJoin('form',{code:room}); }
}catch(e){ console.error('boot',e); FATAL('Boot error: '+e.message); }

})();
</script>
</body>
</html>
